name: Build and deploy Metallic to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    outputs:
      pages_ready: ${{ steps.pages-config.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run benchmark
      - run: npm run build
      - name: Retain checked website artifact
        uses: actions/upload-artifact@v4
        with:
          name: metallic-pages-build
          path: dist/
      - name: Check optional Pages configuration
        id: pages-config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const response=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/pages',{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
          if(!response.ok&&response.status!==404)throw Error('Cannot read Pages configuration: HTTP '+response.status);
          const ready=response.ok&&(await response.json()).build_type==='workflow';
          appendFileSync(process.env.GITHUB_OUTPUT,'ready='+ready+'\n');
          if(!ready)appendFileSync(process.env.GITHUB_STEP_SUMMARY,'GitHub Pages is not configured for Actions. The checked dist artifact is available; optional public deployment was skipped. Existing site access was not changed.\n');
          NODE
      - name: Configure Pages
        if: steps.pages-config.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - name: Upload built website
        if: steps.pages-config.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
  deploy:
    if: needs.build.outputs.pages_ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
